# Streamlit's default primary colour is the same red the app uses for "does not
# match". Reserving red for failures keeps the verdict colours meaningful, and a
# navy primary action still clears WCAG AA against white button text.
[theme]
base = "light"
primaryColor = "#1A4E8A"
textColor = "#16202B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2F6"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
# A label photograph is a few MB; a phone HEIC tops out well under 25. Streamlit's
# 200MB default would let one mis-drag exhaust the deploy's 2.7GB memory ceiling.
maxUploadSize = 25

[browser]
gatherUsageStats = false
